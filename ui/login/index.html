<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · AutoJob</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>try{var t=localStorage.getItem("aj-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="/assets/shared/tokens.css">
  <style>
    body { min-height: 100svh; display: grid; grid-template-rows: auto 1fr; }
    header { display: flex; justify-content: space-between; align-items: center; height: 64px; padding: 0 clamp(16px, 4vw, 48px); border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 10px; font: 600 14px/1 var(--font-mono); letter-spacing: .2em; text-decoration: none; }
    .brand-mark { width: 12px; height: 12px; background: var(--acid-fill); box-shadow: 0 0 0 1px var(--acid); transform: rotate(45deg); }
    main { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: clamp(24px, 6vw, 96px); align-items: center; padding: 48px clamp(16px, 4vw, 48px); max-width: 1200px; width: 100%; margin: 0 auto; }
    h1 { margin: 0 0 8px; font-size: 44px; letter-spacing: -.04em; line-height: 1; }
    form { display: grid; gap: 16px; margin-top: 32px; }
    .err { min-height: 20px; margin: 0; color: var(--hot); font-size: 13px; }
    .demo h2 { margin: 8px 0 20px; font-size: 22px; letter-spacing: -.02em; }
    .demo-grid { display: grid; gap: 4px; }
    .demo-card { display: grid; grid-template-columns: 40px 1fr auto; gap: 16px; align-items: center; width: 100%; padding: 20px; text-align: left; background: var(--panel); border: 1px solid var(--line); cursor: pointer; transition: border-color .15s, background .15s; }
    .demo-card:hover, .demo-card:focus-visible { border-color: var(--acid); background: var(--panel-2); }
    .demo-card strong { display: block; font-size: 17px; }
    .demo-card span.muted { font-size: 13px; }
    .demo-card .role-ix { font: 500 12px var(--font-mono); color: var(--acid); }
    .demo-card .arrow { color: var(--text-3); transition: transform .2s var(--ease-out), color .2s; }
    .demo-card:hover .arrow { transform: translateX(4px); color: var(--acid); }
    .demo[hidden] { display: none; }
    @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body class="noise backdrop">
  <header>
    <a class="brand" href="/"><span class="brand-mark"></span>AUTOJOB</a>
    <span style="display:flex;gap:8px"><button class="btn btn-sm theme-btn" data-theme-toggle type="button"></button><a class="btn btn-sm" href="/"><svg class="icon" aria-hidden="true"><use href="/assets/shared/sprite.svg#i-back"/></svg>Back to site</a></span>
  </header>
  <main>
    <section class="panel" style="padding: clamp(24px, 4vw, 40px)" aria-labelledby="signin-title">
      <p class="label">Operator console</p>
      <h1 id="signin-title">Sign in</h1>
      <p class="muted" style="margin:0">Use the account your admin created.</p>
      <form id="loginForm" novalidate>
        <div class="field"><label class="label" for="email">Email</label><input class="input" id="email" name="email" type="email" autocomplete="username" required></div>
        <div class="field"><label class="label" for="password">Password</label><input class="input" id="password" name="password" type="password" autocomplete="current-password" required></div>
        <p class="err" id="loginErr" role="alert"></p>
        <button class="btn btn-primary" type="submit">Sign in <span class="arrow">→</span></button>
      </form>
    </section>
    <section class="demo" id="demo" aria-labelledby="demo-title" hidden>
      <p class="label">No account? Explore with sample data</p>
      <h2 id="demo-title">Try the live demo as…</h2>
      <div class="demo-grid">
        <button class="demo-card" data-role="admin"><span class="role-ix">01</span><span><strong>Admin</strong><span class="muted">Everything, including dossier edits and the runtime console.</span></span><span class="arrow">→</span></button>
        <button class="demo-card" data-role="operator"><span class="role-ix">02</span><span><strong>Operator</strong><span class="muted">Run the agent, draft proposals, pre-fill and record applications.</span></span><span class="arrow">→</span></button>
        <button class="demo-card" data-role="viewer"><span class="role-ix">03</span><span><strong>Viewer</strong><span class="muted">Read-only: watch the pipeline and browse results.</span></span><span class="arrow">→</span></button>
      </div>
      <p class="label" style="margin-top:16px">Sandboxed copy · resets every 30 min · no browser launched</p>
    </section>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
  <script type="module" src="/assets/login/login.js"></script>
</body>
</html>
